; Speaker relay firmware: receives commands (HTTP on the LAN, or MQTT from the cloud) and
; drives a Google Cast speaker with the Cast v2 protocol. Audio URLs come from the server side.
;
;   pio run -e esp32dev                 build
;   pio run -e esp32dev -t upload       flash (then -t uploadfs is not needed; config lives in LittleFS)
;   pio test -e native                  host unit tests, no board needed

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DRELAY_VERSION=\"0.1.0\"

[esp32_base]
platform = espressif32@~7.0.0
board_build.filesystem = littlefs
board_build.embed_txtfiles = certs/mqtt-roots.pem  ; public root CAs for wss:// brokers (e.g. via Cloudflare)
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
extends = esp32_base
board = esp32dev

[env:esp32-s3]
extends = esp32_base
board = esp32-s3-devkitc-1

[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=c++17
test_build_src = no

; ESP8266 (D1 mini / NodeMCU, 4 MB): one TLS connection at a time, so MQTT must be plain (no TLS).
[env:esp8266]
platform = espressif8266@~4.2.1
board = d1_mini
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
