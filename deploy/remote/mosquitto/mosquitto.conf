# Self-hosted broker for the ESP32 relay (deploy/remote/docker-compose.yml).
#   1883 (TCP)       : the speaker service, inside the compose network only (no published port)
#   9001 (WebSocket) : the relay, reached through the Cloudflare Tunnel as wss://<mqtt hostname>
# Cloudflare terminates TLS, so this listener is plain WebSocket and is never published on the VM.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
listener 9001
protocol websockets
