# Remote deployment: speaker service + self-hosted MQTT broker + Cloudflare Tunnel on a VM; the speaker is
# reached through the ESP32 relay, which connects to the broker over wss:// through the tunnel.
#
#   cp deploy/remote/.env.example deploy/remote/.env                 # fill in, chmod 600
#   cp deploy/remote/mosquitto/acl.example deploy/remote/mosquitto/acl
#   sh deploy/remote/mosquitto/add-user.sh speaker-service           # same password as MQTT_PASSWORD in .env
#   sh deploy/remote/mosquitto/add-user.sh relay-1                   # the relay's own login
#   docker compose -f deploy/remote/docker-compose.yml up -d --build
#
# The backup service saves data.db (online SQLite backup) and config.json every night; see README
# "Backups and restore" for listing, copying off the VM and restoring.
#
# In the Cloudflare dashboard, point the tunnel's public hostnames at http://speaker-service:8090 and
# http://mosquitto:9001. Those names only resolve inside this compose network, so run cloudflared from this
# file; a cloudflared installed on the host answers 502 (stop it: systemctl disable --now cloudflared).
#
# Every value below is a placeholder. Real hostnames, broker credentials and tunnel tokens go in .env
# (git-ignored), never in this file.
x-speaker-build: &speaker-build
  context: ../..
  dockerfile: deploy/remote/Dockerfile

services:
  speaker-service:
    build: *speaker-build
    restart: unless-stopped
    environment:
      SPEAKER_TRANSPORT: mqtt
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}        # e.g. https://speaker-media.example.com (the tunnel hostname)
      MQTT_HOST: mosquitto                       # the broker below, over the compose network
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-speaker-relay/speaker-relay}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-speaker-service}
    volumes:
      - speaker-data:/data
    # No public port: only cloudflared reaches the service. The admin UI is on the VM's loopback;
    # use an SSH tunnel (ssh -L 8090:127.0.0.1:8090 vm) or put it behind Cloudflare Access.
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - mosquitto

  # Same image and user as the service, so it can read the database and its WAL. Idle except for a few
  # seconds a night. Backups stay on this VM; copy them elsewhere too (see README).
  backup:
    build: *speaker-build
    restart: unless-stopped
    command: ["python", "backup.py", "--daemon"]
    environment:
      BACKUP_TIME: ${BACKUP_TIME:-03:30}         # HH:MM, UTC
      BACKUP_KEEP: ${BACKUP_KEEP:-14}            # newest backups kept
    volumes:
      - speaker-data:/data
      - speaker-backups:/backups

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    # No published ports: the service uses 1883 inside this network, and cloudflared forwards the
    # relay's wss:// hostname to 9001.
    volumes:
      - ./mosquitto:/mosquitto/config   # mosquitto.conf (in git), acl and passwd (local only, see add-user.sh)
      - mosquitto-data:/mosquitto/data

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0   # pin to a current release
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - speaker-service
      - mosquitto

volumes:
  speaker-data:
  speaker-backups:
  mosquitto-data:
