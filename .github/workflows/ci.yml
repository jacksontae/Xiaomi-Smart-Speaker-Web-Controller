name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.17"
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: helper script syntax
        run: sh -n scripts/speaker
      - name: config example is valid JSON
        run: python3 -m json.tool config.example.json > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The .env files are git-ignored; the examples hold placeholders only.
      - name: compose files are valid (home and VM)
        run: |
          docker compose -f compose.yaml --env-file .env.example config -q
          docker compose -f deploy/vm/compose.yaml --env-file deploy/vm/.env.example config -q
      - name: VM stack keeps its project name (its volumes hold the production data)
        run: |
          test "$(docker compose -f deploy/vm/compose.yaml --env-file deploy/vm/.env.example config --format json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["name"])')" = remote
      - name: image builds and serves
        run: |
          docker build -t speaker-service:ci .
          docker run -d --name speaker-ci -p 18950:8090 -e PUBLIC_BASE_URL=http://192.0.2.20:18950 speaker-service:ci
          for i in $(seq 30); do curl -fsS -o /dev/null localhost:18950/about && break; sleep 1; done
          curl -fsS -o /dev/null localhost:18950/ && curl -fsS -o /dev/null localhost:18950/about \
            || { docker logs speaker-ci; exit 1; }

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-s3, esp8266]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          # One cache per board: matrix jobs sharing a key race to save it, and the winner's
          # toolchains may not be the ones the other boards need.
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install "platformio>=6.1"
      - name: Cast codec unit tests (host)
        if: matrix.env == 'esp32dev'
        run: pio test -e native
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
